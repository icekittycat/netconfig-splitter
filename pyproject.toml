[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "netconfig-splitter"
version = "0.1.0"
description = "Split combined IOS/IOS-XE/IOS-XR/NX-OS/ASA CLI capture files into per-host, per-command, per-date files."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "netconfig-splitter" }]

[project.scripts]
netconfig-splitter = "netconfig_splitter.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.maturin]
python-source = "src"
module-name = "netconfig_splitter._core"
features = ["pyo3/extension-module"]
